name: CI

on:
    pull_request:
        branches: [main, dev]
    push:
        branches: [main, dev]

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v6

            - uses: ./.github/actions/setup

            - name: Verify generated icons are current
              run: |
                  pnpm generate:icons
                  git diff --exit-code src/lib/components/Icon/bundled.ts

            - name: Lint
              run: pnpm lint

    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v6

            - uses: ./.github/actions/setup

            - name: Type check
              run: pnpm check

    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v6

            - uses: ./.github/actions/setup

            - name: Build
              run: pnpm build

    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v6

            - uses: ./.github/actions/setup

            - name: Install Playwright browsers
              timeout-minutes: 5
              run: pnpm exec playwright install --with-deps --only-shell chromium

            - name: Test
              run: pnpm test
