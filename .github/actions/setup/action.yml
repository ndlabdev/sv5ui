name: Setup
description: Install pnpm, Node.js and the project dependencies

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@v6
          with:
              version: 10

        - uses: actions/setup-node@v6
          with:
              node-version: 22
              cache: pnpm

        - run: pnpm install --frozen-lockfile
          shell: bash
